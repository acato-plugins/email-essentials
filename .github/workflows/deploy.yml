# See: https://github.com/10up/action-wordpress-plugin-deploy
name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      # todo: add build.sh step.
      - uses: actions/checkout@master

      # Whoever pushed the tag releases with their own SVN account when
      # SVN_<LOGIN>_USERNAME and SVN_<LOGIN>_PASSWORD are set, and with the
      # company account otherwise. See .github/scripts/svn-account.sh.
      - name: Find the SVN secrets of who triggered this
        id: who
        env:
          LOGIN: ${{ github.actor }}
        run: .github/scripts/svn-account.sh key "$LOGIN"

      - name: Choose personal or company SVN credentials
        id: svn
        env:
          KEY: ${{ steps.who.outputs.key }}
          PERSONAL_USERNAME: ${{ secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] }}
          PERSONAL_PASSWORD: ${{ secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] }}
          COMPANY_USERNAME: ${{ secrets.SVN_USERNAME }}
          COMPANY_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: .github/scripts/svn-account.sh choose

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] || secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] || secrets.SVN_USERNAME }}
